        plan2:{name:'第 2 轮方案',file:'plan.json',path:'attempts/a000002/plan.json',status:'已生成',owner:'专家',kind:'方案文件',fields:[['本轮补哪条缺口','R2：请求完成并释放资源后恢复接收。'],['方案与理由','修正完成事件的资源释放顺序，沿用现有队列与接口。'],['验证安排','开发 agent 先做局部检查；本轮未请求正式全量评价。']],proof:'这份方案应能回指 R2；吞吐排名不属于本次已确认目标。',raw:'{\n  "title": "修复释放后恢复接收",\n  "changes": "对齐完成事件与容量归还，做局部检查",\n  "base_attempt": 1,\n  "evaluate": false\n}'},
        activity2:{name:'最近一次执行活动',file:'designer-events.jsonl',path:'attempts/a000002/designer/designer-events.jsonl',status:'有活动回执',owner:'开发 agent',kind:'执行日志',fields:[['最近活动','发起容量释放后的接收检查。'],['当前已知','工具调用已开始，尚未收到该调用退出结果。'],['尚不能断言','没有新回执时不能判定检查成功、失败或 agent 卡死。']],proof:'只显示已报告的动作与时间；没有事件时明确写未知。',raw:'{"type":"tool.started","action":"check resume after release"}\n// 尚未收到 tool.completed 回执'},
        execution2:{name:'本轮开发回报',file:'execution 事件',path:'ledger.sqlite3 · attempt 2 / execution',status:'尚未回传',owner:'开发 agent',kind:'账本记录',fields:[['实际实现','当前调用尚未结束，最终实现摘要未回传。'],['设计偏差','尚未报告。'],['验证结论','待实际回执，不提前写成通过。']],proof:'已报告活动和最终回报是两类证据；白板不补造缺失摘要。',raw:'本轮 execution 事件尚未产生。'},
        patch2:{name:'本轮候选补丁',file:'candidate.patch',path:'attempts/a000002/candidate.patch',status:'尚未保存',owner:'引擎',kind:'代码补丁',fields:[['文件状态','开发调用尚未返回，本轮候选补丁未保存。'],['已经保留','第 1 轮候选及本轮已有计划、活动回执。'],['保存边界','未保存的工作副本不能视为已验证成果。']],proof:'不把工作副本中的临时变化冒充已保存、已验证的交付版本。',raw:'本轮 candidate.patch 尚未生成。'},
        final:{name:'最终验收',file:'promotion/report.json',path:'promotion/<终验编号>/report.json',status:'尚未执行',owner:'终验',kind:'终验文件',fields:[['将审什么','选定交付版本是否满足同一组 R1、R2、R3。'],['需要展示','每条要求的支持证据、缺口，以及必要 reviewer 的具体意见。'],['当前状态','尚未终验；当前运行状态和文件存在都不代表任务完成。']],proof:'独立审阅是否需要取决于合同；终验不会凭空为任务增加完成标准。',raw:'终验尚未执行。\n尚无 promotion/report.json。'},
        finalreview:{name:'独立终审意见',file:'reviewer 回执',path:'promotion/<终验编号>/reviewer/',status:'按需调用',owner:'独立 reviewer',kind:'审阅记录',fields:[['审阅对象','选定成果对用户要求的满足情况，以及结论是否超出证据。'],['与准备审阅的区别','准备审阅检查接入工具；本次对象是最终交付成果。'],['当前状态','尚未调用。若任务不要求独立审阅，显示不适用。']],proof:'展示具体理由和逐项意见，不只展示 accept 或 reject。',raw:'独立终审尚未调用；无审阅回执。'}
      };
      const stages = [
        {id:'map',name:'方向地图',status:'已确认 · 可选',title:'方向与边界',work:'优先完成 DMA 行为模型',facts:[['当前方向','容量约束、背压与恢复。'],['选择理由','先明确正确行为，再研究性能收益。'],['保留边界','吞吐优化与跨通道调度后续再讨论。']],files:['map']},
        {id:'task',name:'任务目标',status:'已确认',title:'任务与完成条件',work:'完成 R1、R2、R3',facts:[['交付','实现背压与恢复，保持已有行为。'],['验收','逐条展示行为证据，不使用完成百分比分数。'],['范围','模型和相关测试；本次没有数值优化目标。']],files:['brief']},
        {id:'onboard',name:'执行接入',status:'已就绪',title:'输入接口与验证',work:'把已确认要求连接到执行入口',facts:[['对应关系','task-brief → t-dma / r0001。'],['验证入口','复用已有检查与必要的开发测试。'],['准备边界','实际需要什么才准备什么；文件按实际生成展示。']],files:['contract','component','handoff']},
        {id:'loop',name:'迭代执行',status:'第 2 轮 · 进行中',title:'本轮工作',files:[]},
        {id:'delivery',name:'交付验收',status:'尚未开始',title:'交付与审阅',work:'逐条核对同一组完成条件',facts:[['验收对象','专家选定的交付版本。'],['剩余缺口','R2 待验证；R3 待回归。'],['审阅输出','要求 → 证据 → 判断；额外建议单列。']],files:['final','finalreview']}
      ];
      function selectedStage(){return stages.find(stage=>stage.id===state.stage);}
      function fileIds(){
        if(state.stage!=='loop')return selectedStage().files;
        return state.round===1?['plan1','patch1','evaluation1','conclusion1']:['plan2','activity2','execution2','patch2'];
      }
      function renderFlow(){
        q('flow').innerHTML=stages.map((stage,index)=>{
          return '<button type="button" class="ab-stage cursor-interaction" data-stage="'+stage.id+'" aria-pressed="'+(state.stage===stage.id)+'"><span class="ab-stage-index" aria-hidden="true">'+(index+1)+'</span><span><span class="ab-stage-name">'+stage.name+'</span><span class="ab-stage-state">'+stage.status+'</span></span></button>';
        }).join('');
      }
      function renderWork(){
        const stage=selectedStage();
        q('stage-heading').textContent=stage.title;
        q('rounds').innerHTML=state.stage==='loop'?[1,2].map(n=>'<button type="button" class="ab-round cursor-interaction" data-round="'+n+'" aria-pressed="'+(state.round===n)+'">第 '+n+' 轮</button>').join(''):'';
        let agents='',title=stage.work,facts=stage.facts||[],notice='',replay='';
        if(state.stage==='loop'){
          const past=state.round===1;
          const rows=past?[['专家','已返回方案'],['开发 agent','已返回实现'],['评价命令','检查通过'],['独立终审','尚未执行']]:[['专家','已返回方案'],['开发 agent','调用中'],['正式评价','本轮未请求'],['独立终审','尚未执行']];
          agents='<div class="ab-agents" aria-label="角色与执行状态">'+rows.map((row,index)=>'<div class="ab-agent '+(!past&&index===1?'ab-agent-current':'')+'"><span class="ab-agent-name">'+row[0]+'</span><span class="ab-agent-state">'+row[1]+'</span></div>').join('')+'</div>';
          title=past?'R1 · 实现满载背压':'R2 · 修复资源释放后的恢复';
          facts=past?[['专家选择','请求入口增加容量判断，复用原队列。'],['实际成果','候选已保存，容量边界检查通过。'],['得到结论','R1 获得支持；R2、R3 仍待验证。']]:[['专家选择','调整完成事件与资源归还顺序，沿用既有接口。'],['最近活动','正在执行容量释放后的接收检查。'],['当前结论','开发回报未返回，当前检查结果未知。']];
          if(past)replay='<div class="ab-replay">正在回看第 1 轮 · 顶部状态仍显示当前第 2 轮</div>';
          if(!past)notice='<div class="ab-scope"><span class="ab-scope-label">范围提醒</span><span>新增建议“加入吞吐排名”未纳入任务；不计入剩余必做项。</span></div>';
        }
        const files=fileIds();
        if(!files.includes(state.artifact))state.artifact=files[0];
        q('workbody').innerHTML=replay+agents+'<div class="ab-work-title">'+escape(title)+'</div><dl class="ab-facts">'+facts.map(row=>'<dt>'+escape(row[0])+'</dt><dd>'+escape(row[1])+'</dd>').join('')+'</dl>'+notice+'<div class="ab-files-head"><h3>产物与记录</h3><span>按实际状态展开</span></div><div class="ab-filelist">'+files.map(id=>{const a=artifacts[id];return '<button type="button" class="ab-file cursor-interaction" data-artifact="'+id+'" aria-pressed="'+(state.artifact===id)+'"><span><span class="ab-file-name">'+escape(a.name)+'</span><span class="ab-file-path">'+escape(a.file)+'</span></span><span class="ab-file-state">'+escape(a.status)+'</span></button>';}).join('')+'</div>';
      }
      function renderInspector(){
        const a=artifacts[state.artifact];
        q('detail-state').textContent=a.kind;
        q('inspector').innerHTML='<div class="ab-detail-title">'+escape(a.name)+'</div><div class="ab-path">'+escape(a.path)+'</div><div class="ab-file-meta">'+escape(a.owner)+' · '+escape(a.status)+'</div><div class="ab-detail-list">'+a.fields.map(row=>'<div><span class="ab-detail-label">'+escape(row[0])+'</span><div class="ab-detail-value">'+escape(row[1])+'</div></div>').join('')+'</div><div class="ab-detail-proof">'+escape(a.proof)+'</div><div style="margin-top:13px"><button type="button" class="ab-detail-switch cursor-interaction" data-action="raw" aria-expanded="'+state.raw+'">'+(state.raw?'收起样例原文':'查看样例原文')+'</button></div>'+(state.raw?'<pre class="ab-raw">'+escape(a.raw)+'</pre>':'');
      }
      function render(){renderFlow();renderWork();renderInspector();}
      root.addEventListener('click',event=>{
        const button=event.target.closest('button');
        if(!button||!root.contains(button))return;
        if(button.dataset.stage){state.stage=button.dataset.stage;state.raw=false;state.artifact=null;render();}
        else if(button.dataset.round){state.round=Number(button.dataset.round);state.artifact=null;state.raw=false;render();}
        else if(button.dataset.artifact){state.artifact=button.dataset.artifact;state.raw=false;render();}
        else if(button.dataset.action==='raw'){state.raw=!state.raw;renderInspector();}
      });
      render();
    })();
  </script>
</div>
</body>
</html>
