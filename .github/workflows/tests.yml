name: Cross-platform tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install core test dependencies
        run: python -m pip install -e . pytest
      - name: Test base installation
        run: python -m pytest -q
      - name: Install observer test dependencies
        run: python -m pip install -e '.[observer]' httpx
      - name: Verify observer test dependencies
        run: python -c "import fastapi, httpx, uvicorn; from fastapi.testclient import TestClient; from opc.observer.api import create_app"
      - name: Test observer installation
        run: python -m pytest -q

  observer-linux:
    name: Workbench (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install workbench test dependencies
        run: python -m pip install -e '.[observer,dev]' playwright
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Typecheck and build production workbench
        working-directory: web
        run: npm run build
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Test topic observation and controls
        run: python -m pytest opc/tests tools/tests -q
      - name: Test live observation and material reading
        run: python tools/observer_browser_smoke.py
      - name: Test real workbench controls
        run: python tools/workbench_control_smoke.py
