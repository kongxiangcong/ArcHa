name: Cross-platform tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install core test dependencies
        run: python -m pip install -e . pytest
      - name: Test base installation
        run: python -m pytest -q
      - name: Install observer test dependencies
        run: python -m pip install -e '.[observer]' httpx
      - name: Verify observer test dependencies
        run: python -c "import fastapi, httpx, uvicorn; from fastapi.testclient import TestClient; from opc.observer.api import create_app"
      - name: Test observer installation
        run: python -m pytest -q
