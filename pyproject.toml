[project]
name = "archa-opc"
version = "0.3.0"
description = "Domain-independent engine for automatic, budgeted, evidence-bound iteration"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
observer = ["fastapi==0.119.1", "uvicorn==0.38.0", "pydantic==2.12.3"]

[project.scripts]
opc = "opc.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["opc*"]

[tool.setuptools.package-data]
opc = ["scaffold/*.md", "scaffold/*.py", "scaffold/*.json"]
"opc.observer" = ["static/*.html", "static/*.txt", "static/assets/*"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["opc/tests", "tools/tests"]

